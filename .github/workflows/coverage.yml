name: Coverage

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BLUE_EMAIL: ${{ secrets.BLUE_EMAIL }}
  BLUE_PASSWORD: ${{ secrets.BLUE_PASSWORD }}
  COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
  COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
  COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
  COGNITO_USER_EMAIL: ${{ secrets.COGNITO_USER_EMAIL }}
  COGNITO_USER_EMAIL_ADMIN: ${{ secrets.COGNITO_USER_EMAIL_ADMIN }}
  COGNITO_USER_PASSWORD: ${{ secrets.COGNITO_USER_PASSWORD }}
  COGNITO_USER_PASSWORD_ADMIN: ${{ secrets.COGNITO_USER_PASSWORD_ADMIN }}
  COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
  FLIPPER_EMAIL: ${{ secrets.FLIPPER_EMAIL }}
  FLIPPER_PASSWORD: ${{ secrets.FLIPPER_PASSWORD }}
  MOBY_EMAIL: ${{ secrets.MOBY_EMAIL }}
  MOBY_PASSWORD: ${{ secrets.MOBY_PASSWORD }}
  RAY_EMAIL: ${{ secrets.RAY_EMAIL }}
  RAY_PASSWORD: ${{ secrets.RAY_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Tests coverage
        run: pnpm run coverage

      - name: Check coverage report paths
        # Guard against tooling regressions that write URLs instead of paths
        # into the report (ts-jest 29.4.13), which silently gives 0% on Coveralls.
        run: |
          if grep -q '^SF:.*file:' coverage/lcov.info; then
            echo "::error::coverage/lcov.info contains file: URLs instead of source paths"
            grep -m 3 '^SF:' coverage/lcov.info
            exit 1
          fi

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
