name: Release

on:
  push:
    branches: ['main']
    paths:
      - '.changeset/**'
      - 'CHANGELOG.md'
  pull_request:
    branches: ['main']
    paths:
      - '.changeset/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  release:
    needs: [coverage]
    runs-on: ubuntu-latest
    # Must match the "Environment name" of the npm trusted publisher.
    environment: production
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no npm token is used.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/ci-setup

      - name: Check for changesets
        run: pnpm changeset status --since=origin/main

      # On pull requests only validate the changesets; versioning and
      # publishing must only happen from main.
      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm run build

      - name: Check npm supports trusted publishing
        if: github.event_name != 'pull_request'
        run: |
          echo "node $(node --version), npm $(npm --version), pnpm $(pnpm --version)"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"

      - name: Create Release Pull Request or Publish
        if: github.event_name != 'pull_request'
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}